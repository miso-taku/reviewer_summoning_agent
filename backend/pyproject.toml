[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "review-summoning"
version = "0.1.0"
description = "レビュアー召喚 Web のバックエンド（FastAPI + PydanticAI、DDD/TDD）"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "reviewer_summoning_agent contributors" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-ai>=0.0.14,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<1.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/review_summoning"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not llm_live",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm_live: 実 LLM プロバイダを呼び出すテスト（CI 既定では除外。pytest -m llm_live で実行）",
    "req: 要求 ID とのトレース用マーカー（例: @pytest.mark.req('REQ-F-001')）",
]

[tool.coverage.run]
branch = true
source = ["review_summoning"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]
